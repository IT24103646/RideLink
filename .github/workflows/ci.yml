jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - account-service
          - driver-service/driver-service
          - _ride-service/ride-service
          - fare-payment-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check service folder
        id: check-service
        shell: bash
        run: |
          if [ -f "${{ matrix.service }}/mvnw" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.service }} because it is not present in this branch."
          fi

      - name: Build and test
        if: steps.check-service.outputs.exists == 'true'
        working-directory: ${{ matrix.service }}
        run: |
          chmod +x mvnw
          ./mvnw clean test