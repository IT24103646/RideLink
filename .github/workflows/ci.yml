name: RideLink CI

on:
  push:
    branches:
      - main
      - account-service
      - driver-service
      - ride-service
      - fare-payment-service
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - account-service
          - driver-service/driver-service
          - _ride-service/ride-service
          - fare-payment-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        working-directory: ${{ matrix.service }}
        run: |
          chmod +x mvnw
          ./mvnw clean test